<!-- Supabase → Authentication → Emails → Confirm signup
     Subject: ยืนยันอีเมลเพื่อเริ่มใช้งาน Coinly -->
<div style="background:#0A0A0F;padding:40px 16px;font-family:'Noto Sans Thai',Inter,Arial,sans-serif">
  <div style="max-width:440px;margin:0 auto;background:#16161F;border:1px solid #2A2540;border-radius:24px;padding:32px;color:#F4F4F8">
    <p style="margin:0 0 4px;color:#A78BFA;font-weight:600">Coinly</p>
    <h1 style="margin:0 0 12px;font-size:22px">ยืนยันอีเมลของคุณ</h1>
    <p style="margin:0 0 24px;color:#A1A1B5;line-height:1.6">ขอบคุณที่สมัครใช้งาน Coinly กดปุ่มด้านล่างเพื่อยืนยันอีเมล <strong style="color:#F4F4F8">{{ .Email }}</strong> และเริ่มบันทึกรายรับรายจ่าย</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#8B5CF6;color:#fff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:12px">ยืนยันอีเมล</a>
    <p style="margin:24px 0 0;color:#8A8AA0;font-size:12px;line-height:1.6">ลิงก์นี้ใช้ได้ครั้งเดียวและจะหมดอายุภายใน 24 ชั่วโมง หากคุณไม่ได้สมัครใช้งาน สามารถเพิกเฉยอีเมลนี้ได้</p>
  </div>
</div>
