<!-- Supabase → Authentication → Emails → Reset Password
     Subject: ตั้งรหัสผ่านใหม่สำหรับ Coinly -->
<div style="background:#0A0A0F;padding:40px 16px;font-family:'Noto Sans Thai',Inter,Arial,sans-serif">
  <div style="max-width:440px;margin:0 auto;background:#16161F;border:1px solid #2A2540;border-radius:24px;padding:32px;color:#F4F4F8">
    <p style="margin:0 0 4px;color:#A78BFA;font-weight:600">Coinly</p>
    <h1 style="margin:0 0 12px;font-size:22px">ตั้งรหัสผ่านใหม่</h1>
    <p style="margin:0 0 24px;color:#A1A1B5;line-height:1.6">เราได้รับคำขอรีเซ็ตรหัสผ่านสำหรับ <strong style="color:#F4F4F8">{{ .Email }}</strong> กดปุ่มด้านล่างเพื่อตั้งรหัสผ่านใหม่</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#8B5CF6;color:#fff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:12px">ตั้งรหัสผ่านใหม่</a>
    <p style="margin:24px 0 0;color:#8A8AA0;font-size:12px;line-height:1.6">ลิงก์นี้ใช้ได้ครั้งเดียวและจะหมดอายุภายใน 1 ชั่วโมง หากคุณไม่ได้ขอรีเซ็ตรหัสผ่าน ไม่ต้องทำอะไร รหัสผ่านเดิมยังใช้ได้ตามปกติ</p>
  </div>
</div>
